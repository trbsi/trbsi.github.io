      return {
        every(fn, ms) { const i = setInterval(fn, ms); ivs.push(i); return i; },
        after(fn, ms) { const t = setTimeout(fn, ms); tos.push(t); return t; },

      const kick = () => { try { const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .15); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .22); } catch (e) {} };

        q('ep').textContent = `S01 · E${String(ep).padStart(2, '0')}`; q('log').innerHTML = ''; q('stats').innerHTML = '';
        lines.forEach((l, i) => ctx.after(() => { if (my !== token) return; const p = document.createElement('div'); p.className = 'pop'; p.innerHTML = l; q('log').append(p); tone(300 + i * 120, .1, 'triangle', 0, .06); if (i === 2) sweep(200, 40, .5, 'sawtooth', 0, .15); }, i * 900));
        ctx.after(() => { if (my !== token) return; q('stats').innerHTML = [['Lives saved', 1], ['Drinks', drinks], ['Damage', fmt(dmg)]].map(([k, v]) => `<div class="p-3 border-r border-white/10 last:border-0"><div class="text-[10px] uppercase tracking-widest text-neutral-500">${k}</div><div class="font-display text-2xl text-white">${v}</div></div>`).join(''); q('total').textContent = fmt(totalDmg); }, lines.length * 900);
      };
    });

    // =====================================================================
    //  LIST RENDERING
    // =====================================================================
    let activeCat = 'All', query = '', showNsfw = true;
    let openIdx = null, openCtx = null;

    const visibleBase = () => ideas.filter(i => showNsfw || !i.nsfw);

    function renderStats() {
      const base = visibleBase();
      const cats = new Set(base.map(i => i.cat)).size;
      const hidden = ideas.length - base.length;
      $('stats').innerHTML = [[base.length, 'ideas'], [cats, 'categories'], ...(hidden ? [[hidden, 'hidden (18+)']] : [])]
        .map(([n, l]) => `<div class="px-4 py-2 rounded-full bg-white/5 border border-white/10"><span class="text-white font-semibold">${n}</span> <span class="text-neutral-400">${l}</span></div>`).join('');
    }

    function renderFilters() {
      const base = visibleBase();
      const cats = ['All', ...Object.keys(catColors).filter(c => base.some(i => i.cat === c))];
      if (!cats.includes(activeCat)) activeCat = 'All';
      $('filters').innerHTML = cats.map(c => {
        const n = c === 'All' ? base.length : base.filter(i => i.cat === c).length;
        return `<button data-cat="${c}" class="px-3.5 py-1.5 rounded-full text-sm border transition ${c === activeCat
          ? 'bg-ember border-ember text-white' : 'bg-white/5 border-white/10 text-neutral-300 hover:border-ember/60'}">${c} <span class="opacity-60">${n}</span></button>`;
      }).join('');
    }

    function filtered() {
      const q = query.trim().toLowerCase();
      return visibleBase().filter(i =>
        (activeCat === 'All' || i.cat === activeCat) &&
        (!q || `${i.name} ${i.desc} ${i.cat}`.toLowerCase().includes(q)));
    }

    const panelShell = (hint) => `<div class="max-w-7xl mx-auto px-5 sm:px-10 pb-12 sm:pb-16">
      <div class="rounded-3xl border border-white/10 bg-[#1d0907]/90 p-5 sm:p-8 shadow-2xl">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-5 border-b border-white/10">
          <div class="flex items-center gap-3 min-w-0"><span class="w-2 h-2 rounded-full bg-ember animate-pulse shrink-0"></span><span class="text-xs uppercase tracking-[.3em] text-ember shrink-0">Prototype</span><span class="text-sm text-neutral-400">${esc(hint)}</span></div>
          <button data-close class="text-sm text-neutral-500 hover:text-white transition">Close ✕</button>
        </div>
        <div class="stage"></div>
      </div></div>`;

    function closeOpen() {
      if (openIdx === null) return;
      if (openCtx) { openCtx.dispose(); openCtx = null; }
      const art = document.querySelector(`.item[data-idx="${openIdx}"]`);
      if (art) {
        art.classList.remove('open');
        const p = art.querySelector('.panel'); p.classList.add('hidden'); p.innerHTML = '';
        art.querySelector('.row').setAttribute('aria-expanded', 'false');
        art.querySelector('.try-label').textContent = 'Try the prototype';
      }
      openIdx = null;
    }

    function openItem(idx, scroll = true) {
      closeOpen();
      const art = document.querySelector(`.item[data-idx="${idx}"]`);
      const demo = DEMOS[ideas[idx].name];
      if (!art || !demo) return;
      const p = art.querySelector('.panel');
      p.innerHTML = panelShell(demo.hint);
      const el = document.createElement('div');
      p.querySelector('.stage').append(el);
      openCtx = makeCtx();
      try { demo.fn(el, openCtx); }
      catch (err) { console.error(err); el.innerHTML = '<p class="text-neutral-400">This prototype failed to load.</p>'; }
      p.classList.remove('hidden');
      art.classList.add('open', 'in');
      art.querySelector('.row').setAttribute('aria-expanded', 'true');
      art.querySelector('.try-label').textContent = 'Close prototype';
      openIdx = idx;
      if (scroll) requestAnimationFrame(() => art.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }

    function renderGrid() {
      const wasOpen = openIdx;
      closeOpen();
      const list = filtered();
      $('empty').classList.toggle('hidden', list.length > 0);
      $('grid').innerHTML = list.map(i => {
        const idx = ideas.indexOf(i);
        const num = String(idx + 1).padStart(2, '0');
        return `
        <article id="idea-${num}" data-idx="${idx}" class="item reveal border-b border-white/10">
          <div class="row" role="button" tabindex="0" aria-expanded="false" aria-controls="panel-${num}">
            <div class="max-w-7xl mx-auto px-5 sm:px-10 py-10 sm:py-14 grid grid-cols-12 gap-x-6 gap-y-4 items-center">
              <div class="col-span-12 lg:col-span-2 flex lg:flex-col items-center lg:items-start gap-4">
                <span class="outline-num font-display text-6xl sm:text-7xl leading-none">${num}</span>
                <span class="emoji text-4xl sm:text-5xl inline-block">${i.emoji}</span>
              </div>
              <div class="col-span-12 lg:col-span-6">
                <div class="flex items-center gap-3 mb-2">
                  <span class="cat text-xs uppercase tracking-[.3em] ${catColors[i.cat]} transition-colors">${esc(i.cat)}</span>
                  ${i.nsfw ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white text-ember">18+</span>' : ''}
                </div>
                <h2 class="title font-display uppercase text-5xl sm:text-6xl lg:text-7xl text-white leading-[.95] tracking-tight break-words">${esc(i.name)}</h2>
              </div>
              <div class="col-span-12 lg:col-span-4">
                <p class="desc text-lg sm:text-xl text-neutral-400 leading-relaxed transition-colors">${esc(i.desc)}</p>
                <span class="try mt-4 inline-flex items-center gap-2 text-xs uppercase tracking-[.25em] text-ember transition-colors"><span class="chev text-base leading-none">＋</span><span class="try-label">Try the prototype</span></span>
              </div>
            </div>
          </div>
          <div id="panel-${num}" class="panel hidden"></div>
        </article>`;
      }).join('');
      observeRows();
      if (wasOpen !== null && list.includes(ideas[wasOpen])) openItem(wasOpen, false);
    }

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.05 });
    function observeRows() { document.querySelectorAll('.item.reveal').forEach(r => io.observe(r)); }

    function renderMarquee() {
      const names = ideas.map(i => `${esc(i.name)} <span class="text-white/30">✦</span>`).join(' ');
      $('marquee').innerHTML = `<span>${names}</span><span>${names}</span>`;
    }

    function renderAll() { renderStats(); renderFilters(); renderGrid(); }

    const toggleItem = idx => (openIdx === idx ? closeOpen() : openItem(idx));
    $('grid').addEventListener('click', e => {
      if (e.target.closest('[data-close]')) { const idx = openIdx; closeOpen(); const art = document.querySelector(`.item[data-idx="${idx}"]`); art && art.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const row = e.target.closest('.row');
      if (row) toggleItem(+row.closest('.item').dataset.idx);
    });
    $('grid').addEventListener('keydown', e => {
      const row = e.target.closest && e.target.closest('.row');
      if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleItem(+row.closest('.item').dataset.idx); }
    });

    $('filters').addEventListener('click', e => {
      const b = e.target.closest('button[data-cat]'); if (!b) return;
      activeCat = b.dataset.cat; renderFilters(); renderGrid();
    });
    $('search').addEventListener('input', e => { query = e.target.value; renderGrid(); });
    $('random').addEventListener('click', () => {
      const list = filtered(); if (!list.length) return;
      const pick = list[Math.floor(Math.random() * list.length)];
      const el = $(`idea-${String(ideas.indexOf(pick) + 1).padStart(2, '0')}`);
      document.querySelectorAll('.spotlight').forEach(x => x.classList.remove('spotlight'));
      el.classList.add('in');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const row = el.querySelector('.row');
      row.classList.add('spotlight');
      setTimeout(() => row.classList.remove('spotlight'), 2500);
    });

    $('year').textContent = new Date().getFullYear();
    renderMarquee();
    renderAll();
  </script>
</body>
</html>
